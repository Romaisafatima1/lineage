<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineage dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#262a36; --text:#e6e8ef; --muted:#8b91a3;
          --accent:#5b8def; --good:#3fb97a; --bad:#e5534b; --warn:#e3a52b; --gated:#5b8def; --ungated:#e5534b; --base:#8b91a3; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,Segoe UI,Inter,Roboto,sans-serif }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap }
  header h1 { font-size:18px; margin:0; letter-spacing:.2px } header h1 span { color:var(--muted); font-weight:400 }
  nav { display:flex; gap:4px; flex-wrap:wrap } nav button { background:none; border:1px solid transparent; color:var(--muted); padding:6px 10px; border-radius:8px; cursor:pointer; font:inherit }
  nav button.on { color:var(--text); border-color:var(--line); background:var(--panel) }
  main { padding:16px 20px; max-width:1400px; margin:0 auto }
  .grid { display:grid; gap:14px } .g2 { grid-template-columns:1fr 1fr } .g3 { grid-template-columns:repeat(3,1fr) } .g4 { grid-template-columns:repeat(4,1fr) }
  @media (max-width:900px){ .g2,.g3,.g4 { grid-template-columns:1fr } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 10px }
  .stat { font-size:28px; font-weight:600 } .sub { color:var(--muted); font-size:12px }
  table { width:100%; border-collapse:collapse; font-size:13px } th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top }
  th { color:var(--muted); font-weight:500 } tr.click { cursor:pointer } tr.click:hover { background:#1d2130 }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600 }
  .accept { background:#173b2a; color:var(--good) } .reject { background:#3b1d1b; color:var(--bad) } .review { background:#3b2f14; color:var(--warn) } .invalid { background:#262a36; color:var(--muted) }
  .ok { color:var(--good) } .miss { color:var(--bad) }
  .diff { font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; background:#0f1117; border:1px solid var(--line); border-radius:8px; padding:10px }
  .diff .add { color:var(--good) } .diff .del { color:var(--bad); text-decoration:line-through } .diff .same { color:var(--muted) }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:7px 12px; cursor:pointer; font:inherit } .btn.ghost { background:none; border:1px solid var(--line); color:var(--text) }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  .empty { color:var(--muted); padding:30px; text-align:center }
  input[type=file] { color:var(--muted) }
  select, input[type=text] { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px }
  footer { color:var(--muted); font-size:12px; padding:20px; text-align:center }
  canvas { max-height:320px }
</style>
</head>
<body>
<header>
  <h1>Lineage <span>· self-improvement you can audit</span></h1>
  <nav id="nav"></nav>
  <div style="margin-left:auto" class="row">
    <span id="runname" class="sub"></span>
    <input type="file" id="file" accept=".jsonl">
  </div>
</header>
<main id="main"><div class="empty">Load a run: pick <code>runs/&lt;name&gt;/events.jsonl</code>, or open this page with <code>?run=path/to/events.jsonl</code>.</div></main>
<footer>Built with Muse Spark Open · Muse Spark · Muse Wonder · Muse Code — every number on this page is computed from the run's event log.</footer>

<script>
const VIEWS = ["Triage", "Curves", "Divergence", "Edits", "Review queue", "Blame", "Rollback", "Cost"];
let EV = [], view = "Triage", state = { lineage: null, issue: null };
const colorOf = n => n.startsWith("gated") ? "var(--gated)" : n.startsWith("ungated") ? "var(--ungated)" : "var(--base)";
const hex = n => n.startsWith("gated") ? "#5b8def" : n.startsWith("ungated") ? "#e5534b" : "#8b91a3";
const pct = x => x == null ? "–" : (100 * x).toFixed(0) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const by = (t, f = () => true) => EV.filter(e => e.type === t && f(e));

document.getElementById("nav").innerHTML = VIEWS.map(v => `<button data-v="${v}">${v}</button>`).join("");
document.getElementById("nav").onclick = e => { if (e.target.dataset.v) { view = e.target.dataset.v; render(); } };
document.getElementById("file").onchange = async e => { const f = e.target.files[0]; if (f) load(await f.text(), f.name); };
const q = new URLSearchParams(location.search).get("run");
if (q) fetch(q).then(r => r.text()).then(t => load(t, q)).catch(() => {});

function load(text, name) {
  EV = text.split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
  document.getElementById("runname").textContent = name + " · " + EV.length + " events";
  render();
}

function lineages() {
  const seen = new Map();
  for (const e of EV) if (e.lineage && e.mode && !seen.has(e.lineage)) seen.set(e.lineage, e.mode);
  return [...seen.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}
function finalPlaybook(ln) {
  const ft = by("final_test", e => e.lineage === ln).at(-1);
  if (ft) return ft.playbook;
  const st = by("state", e => e.lineage === ln).at(-1);
  return st ? st.playbook : null;
}
function rolling(arr, k = 3) { return arr.map((_, i) => { const s = arr.slice(Math.max(0, i - k + 1), i + 1); return s.reduce((a, b) => a + b, 0) / s.length; }); }

function render() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  const m = document.getElementById("main");
  if (!EV.length) return;
  m.innerHTML = ({ "Triage": vTriage, "Curves": vCurves, "Divergence": vDivergence, "Edits": vEdits,
                   "Review queue": vReview, "Blame": vBlame, "Rollback": vRollback, "Cost": vCost })[view]();
  if (view === "Curves") drawCurves();
  if (view === "Divergence") drawDivergence();
  if (view === "Cost") drawCost();
}

// ---------- Triage: the screen a team would use ----------
function vTriage() {
  const lns = lineages();
  const gated = lns.find(([n]) => n.startsWith("gated"))?.[0] || lns[0]?.[0];
  state.lineage = state.lineage || gated;
  const ft = by("final_test", e => e.lineage === state.lineage).at(-1);
  const gen = by("generation", e => e.lineage === state.lineage).at(-1);
  const src = ft ? { label: "locked test set (scored once, never used for gating)", d: ft.decisions, pb: ft.playbook }
                 : gen ? { label: `latest learning batch (generation ${gen.gen})`, d: gen.decisions, pb: finalPlaybook(state.lineage) } : null;
  const finals = by("final_test");
  const cards = finals.length ? finals.map(f => `<div class="card"><h2 style="color:${colorOf(f.lineage)}">${f.lineage}</h2>
      <div class="stat">${pct(f.score.both_acc)}</div><div class="sub">kind ${pct(f.score.kind_acc)} · area ${pct(f.score.area_acc)} · locked test, n=${f.score.n}</div></div>`).join("")
    : `<div class="card"><div class="sub">Final locked-test scores appear when the run finishes.</div></div>`;
  const sel = `<select onchange="state.lineage=this.value;render()">${lns.map(([n, mode]) => `<option ${n === state.lineage ? "selected" : ""} value="${n}">${n} (${mode})</option>`).join("")}</select>`;
  const rules = src ? Object.fromEntries(src.pb.rules.map(r => [r.id, r])) : {};
  const rows = src ? src.d.map(x => {
    const ok = x.kind === x.true_kind && x.true_areas.includes(x.area);
    const rr = (x.rule_ids || []).map(id => rules[id] ? `<span class="mono" title="${esc(rules[id].text)}">${id}${rules[id].gen ? ` (g${rules[id].gen})` : ""}</span>` : `<span class="mono">${id}</span>`).join(", ");
    return `<tr class="click" onclick="state.issue='${x.id}';view='Blame';render()"><td class="mono">#${x.id}</td><td>${x.kind} / ${x.area}</td><td>${x.true_kind} / ${x.true_areas.join(" or ")}</td><td class="${ok ? "ok" : "miss"}">${ok ? "✓" : "✗"}</td><td>${(x.confidence * 100).toFixed(0)}%</td><td>${rr || "<span class=sub>seed rules</span>"}</td></tr>`;
  }).join("") : "";
  return `<div class="grid g4" style="margin-bottom:14px">${cards}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Today's triage · ${sel}</h2><span class="sub">${src ? src.label : ""}</span></div>
  ${src ? `<table><tr><th>Issue</th><th>Agent said</th><th>Project's label</th><th></th><th>Conf.</th><th>Rules relied on (click a row for blame)</th></tr>${rows}</table>` : `<div class="empty">No decisions yet.</div>`}</div>
  <div class="card" style="margin-top:14px"><h2>Current playbook · ${state.lineage}</h2>${src ? src.pb.rules.map(r => `<div><span class="mono">[${r.id}]</span> ${esc(r.text)} <span class="sub">${r.gen ? `added g${r.gen}` : "seed"}</span></div>`).join("") : ""}</div>`;
}

// ---------- Curves ----------
function vCurves() {
  return `<div class="grid g2"><div class="card"><h2>Learning-batch accuracy, rolling 3 generations</h2><canvas id="c1"></canvas></div>
  <div class="card"><h2>Probe-set accuracy (fixed 50 issues)</h2><canvas id="c2"></canvas></div></div>
  <div class="card" style="margin-top:14px"><h2>Locked test set, final</h2><canvas id="c3" style="max-height:200px"></canvas></div>`;
}
function drawCurves() {
  const lns = lineages();
  const ds1 = lns.map(([n]) => { const g = by("generation", e => e.lineage === n); return { label: n, data: rolling(g.map(e => e.score.both_acc)).map((y, i) => ({ x: g[i].gen, y })), borderColor: hex(n), backgroundColor: hex(n), borderDash: n.startsWith("ungated") ? [4, 3] : n === "baseline" ? [1, 3] : [], tension: .3, pointRadius: 2 }; });
  const ds2 = lns.map(([n]) => { const g = by("probe", e => e.lineage === n); return { label: n, data: g.map(e => ({ x: e.gen, y: e.score.both_acc })), borderColor: hex(n), backgroundColor: hex(n), borderDash: n.startsWith("ungated") ? [4, 3] : n === "baseline" ? [1, 3] : [], tension: .2, pointRadius: 3 }; });
  const poison = by("generation", e => e.poisoned > 0)[0]?.gen;
  const opts = { responsive: true, scales: { x: { type: "linear", title: { display: true, text: "generation" }, ticks: { color: "#8b91a3" }, grid: { color: "#262a36" } }, y: { min: 0, max: 1, ticks: { color: "#8b91a3", callback: v => (v * 100) + "%" }, grid: { color: "#262a36" } } }, plugins: { legend: { labels: { color: "#e6e8ef" } }, annotation: undefined } };
  new Chart(document.getElementById("c1"), { type: "line", data: { datasets: ds1 }, options: opts });
  new Chart(document.getElementById("c2"), { type: "line", data: { datasets: ds2 }, options: opts });
  const ft = by("final_test");
  new Chart(document.getElementById("c3"), { type: "bar", data: { labels: ft.map(f => f.lineage), datasets: [{ label: "both labels right", data: ft.map(f => f.score.both_acc), backgroundColor: ft.map(f => hex(f.lineage)) }] },
    options: { indexAxis: "y", scales: { x: { min: 0, max: 1, ticks: { color: "#8b91a3", callback: v => (v * 100) + "%" }, grid: { color: "#262a36" } }, y: { ticks: { color: "#e6e8ef" }, grid: { display: false } } }, plugins: { legend: { display: false } } } });
  if (poison) document.querySelector("#c1").insertAdjacentHTML("afterend", `<div class="sub">Adversarial relabeling injected at generation ${poison}.</div>`);
}

// ---------- Divergence ----------
function vDivergence() {
  const d = by("divergence");
  const last = d.at(-1);
  return `<div class="grid g2" style="margin-bottom:14px"><div class="card"><h2>Gated lineages: how differently they behave</h2><div class="stat" style="color:var(--gated)">${last ? pct(last.gated_mean) : "–"}</div><div class="sub">mean pairwise disagreement on the probe set</div></div>
  <div class="card"><h2>Ungated lineages</h2><div class="stat" style="color:var(--ungated)">${last ? pct(last.ungated_mean) : "–"}</div><div class="sub">same procedure, same data, no gate</div></div></div>
  <div class="card"><h2>Drift over generations</h2><canvas id="c4"></canvas><div class="sub" style="margin-top:8px">Lineages start from the same playbook and see the same issues. The gate keeps the improvement process reproducible; without it, descendants become different agents.</div></div>`;
}
function drawDivergence() {
  const d = by("divergence");
  new Chart(document.getElementById("c4"), { type: "line", data: { labels: d.map(e => e.gen), datasets: [
    { label: "gated", data: d.map(e => e.gated_mean), borderColor: "#5b8def", backgroundColor: "#5b8def", tension: .3 },
    { label: "ungated", data: d.map(e => e.ungated_mean), borderColor: "#e5534b", backgroundColor: "#e5534b", tension: .3 }] },
    options: { scales: { x: { title: { display: true, text: "generation" }, ticks: { color: "#8b91a3" }, grid: { color: "#262a36" } }, y: { min: 0, ticks: { color: "#8b91a3", callback: v => (v * 100).toFixed(0) + "%" }, grid: { color: "#262a36" } } }, plugins: { legend: { labels: { color: "#e6e8ef" } } } } });
}

// ---------- Edits with diffs ----------
function diffHtml(before, after) {
  if (!before) return "";
  const b = new Map(before.rules.map(r => [r.id, r.text])), a = new Map((after || before).rules.map(r => [r.id, r.text]));
  const ids = [...new Set([...b.keys(), ...a.keys()])];
  return ids.map(id => {
    if (b.has(id) && !a.has(id)) return `<div class="del">- [${id}] ${esc(b.get(id))}</div>`;
    if (!b.has(id) && a.has(id)) return `<div class="add">+ [${id}] ${esc(a.get(id))}</div>`;
    if (b.get(id) !== a.get(id)) return `<div class="del">- [${id}] ${esc(b.get(id))}</div><div class="add">+ [${id}] ${esc(a.get(id))}</div>`;
    return `<div class="same">  [${id}] ${esc(b.get(id))}</div>`;
  }).join("");
}
function proposedAfter(e) {   // for rejected edits, show what the playbook would have become
  if (e.after) return e.after;
  const pb = JSON.parse(JSON.stringify(e.before)); const ed = e.edit;
  if (ed.op === "add") pb.rules.push({ id: "R" + pb.next_id, text: ed.text, gen: e.gen, edit_id: e.edit_id });
  if (ed.op === "change") { const r = pb.rules.find(r => r.id === ed.rule_id); if (r) r.text = ed.text; }
  if (ed.op === "delete") pb.rules = pb.rules.filter(r => r.id !== ed.rule_id);
  return pb;
}
function vEdits() {
  const lns = lineages();
  const f = state.editFilter || "all";
  const sel = `<select onchange="state.editFilter=this.value;render()"><option value="all">all lineages</option>${lns.map(([n]) => `<option ${f === n ? "selected" : ""}>${n}</option>`).join("")}</select>`;
  const es = by("edit", e => f === "all" || e.lineage === f).slice().reverse();
  const rows = es.map((e, i) => {
    const sc = e.scores ? Object.entries(e.scores).map(([j, s]) => `${j.replace("juror_", "")}: ${pct(s.old)}→${pct(s.new)}`).join(" · ") : "";
    const can = e.canary ? ` · canary ${e.canary.correct}/${e.canary.n}` : "";
    return `<tr class="click" onclick="toggle('d${i}')"><td class="mono">g${e.gen}</td><td style="color:${colorOf(e.lineage)}">${e.lineage}</td><td class="mono">${e.edit.op}</td><td>${esc(e.edit.text || e.edit.rule_id || "")}${e.poisoned_batch ? ' <span class="tag review">poisoned batch</span>' : ""}</td><td><span class="tag ${e.decision}">${e.decision}</span></td><td class="sub">${esc(e.reason)}<br>${sc}${can}</td></tr>
    <tr id="d${i}" style="display:none"><td colspan="6"><div class="diff">${diffHtml(e.before, proposedAfter(e))}</div>${e.arbiter ? `<div class="sub" style="margin-top:6px"><b>Arbiter (${esc(e.arbiter.model)})</b>: ${esc(e.arbiter.reason)}</div>` : ""}<div class="sub">Agent's reason: ${esc(e.edit.reason || "")}</div></td></tr>`;
  }).join("");
  const n = { accept: 0, reject: 0, review: 0, invalid: 0 }; by("edit").forEach(e => n[e.decision] = (n[e.decision] || 0) + 1);
  return `<div class="grid g4" style="margin-bottom:14px">${["accept", "reject", "review", "invalid"].map(k => `<div class="card"><h2>${k}</h2><div class="stat">${n[k] || 0}</div></div>`).join("")}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Every self-edit, newest first · ${sel}</h2><span class="sub">click a row for the diff</span></div><table><tr><th>Gen</th><th>Lineage</th><th>Op</th><th>Proposed rule</th><th>Verdict</th><th>Why</th></tr>${rows}</table></div>`;
}
function toggle(id) { const el = document.getElementById(id); el.style.display = el.style.display === "none" ? "" : "none"; }

// ---------- Review queue ----------
function vReview() {
  const items = by("edit", e => e.decision === "review").slice().reverse();
  state.overrides = state.overrides || {};
  if (!items.length) return `<div class="card"><div class="empty">No split verdicts in this run. Items land here when the two jurors disagree; the arbiter's ruling is attached and a human has the final say.</div></div>`;
  return `<div class="card"><h2>Human review · ${items.length} split verdict${items.length > 1 ? "s" : ""}</h2>` + items.map((e, i) => {
    const ov = state.overrides[e.edit_id];
    return `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:space-between"><div><b style="color:${colorOf(e.lineage)}">${e.lineage}</b> · g${e.gen} · <span class="mono">${e.edit.op}</span> ${esc(e.edit.text || e.edit.rule_id)}</div>
      <div class="row">${ov ? `<span class="tag ${ov}">human: ${ov}</span>` : `<button class="btn" onclick="state.overrides['${e.edit_id}']='accept';render()">Approve</button><button class="btn ghost" onclick="state.overrides['${e.edit_id}']='reject';render()">Reject</button>`}</div></div>
      <div class="sub" style="margin-top:6px">Jurors: ${Object.entries(e.votes).map(([j, v]) => `${j.replace("juror_", "")} ${v} (${pct(e.scores[j].old)}→${pct(e.scores[j].new)})`).join(" · ")}</div>
      <div class="sub">Arbiter (${esc(e.arbiter?.model)}) says <b>${esc(e.arbiter?.decision)}</b>: ${esc(e.arbiter?.reason)}</div>
      <div class="sub">Run applied: ${e.applied ? "yes (followed the arbiter)" : "no"}. To make an override permanent, roll back or re-apply with <span class="mono">python -m lineage.rollback</span>.</div>
      <div class="diff" style="margin-top:8px">${diffHtml(e.before, proposedAfter(e))}</div></div>`;
  }).join("") + "</div>";
}

// ---------- Blame ----------
function vBlame() {
  const lns = lineages();
  state.lineage = state.lineage || lns[0]?.[0];
  const ft = by("final_test", e => e.lineage === state.lineage).at(-1);
  const sel = `<select onchange="state.lineage=this.value;state.issue=null;render()">${lns.map(([n]) => `<option ${n === state.lineage ? "selected" : ""}>${n}</option>`).join("")}</select>`;
  if (!ft) return `<div class="card"><h2>Blame · ${sel}</h2><div class="empty">Blame uses the locked-test decisions; they appear when the run finishes.</div></div>`;
  const misses = ft.decisions.filter(x => !(x.kind === x.true_kind && x.true_areas.includes(x.area)));
  state.issue = state.issue && ft.decisions.find(x => x.id === state.issue) ? state.issue : misses[0]?.id;
  const d = ft.decisions.find(x => x.id === state.issue);
  const pb = Object.fromEntries(ft.playbook.rules.map(r => [r.id, r]));
  const edits = Object.fromEntries(by("edit").map(e => [e.edit_id, e]));
  const trail = d ? (d.rule_ids || []).map(id => { const r = pb[id]; const e = r?.edit_id ? edits[r.edit_id] : null; return { id, r, e }; }) : [];
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Blame · ${sel}</h2><span class="sub">${misses.length} misses of ${ft.decisions.length} on the locked test set</span></div>
  <div class="row"><select onchange="state.issue=this.value;render()">${ft.decisions.map(x => `<option value="${x.id}" ${x.id === state.issue ? "selected" : ""}>#${x.id} ${x.kind === x.true_kind && x.true_areas.includes(x.area) ? "✓" : "✗"} said ${x.kind}/${x.area}, truth ${x.true_kind}/${x.true_areas.join("|")}</option>`).join("")}</select></div>
  ${d ? `<div style="margin-top:14px">${trail.length ? trail.map(t => t.r ? `<div class="card" style="margin-bottom:10px"><div><span class="mono">[${t.id}]</span> ${esc(t.r.text)}</div>
      ${t.e ? `<div class="sub" style="margin-top:6px">Introduced by <span class="mono">${t.e.edit_id}</span> at generation ${t.e.gen} · verdict <span class="tag ${t.e.decision}">${t.e.decision}</span> · ${esc(t.e.reason)}${t.e.poisoned_batch ? ' · <span class="tag review">learned from the poisoned batch</span>' : ""}</div>
      <div class="row" style="margin-top:8px"><span class="sub">Roll it back:</span> <span class="mono">python -m lineage.rollback --run &lt;run&gt; --lineage ${state.lineage} --edit ${t.e.edit_id}</span></div>` : `<div class="sub">Seed rule, present from generation 0.</div>`}</div>` : `<div class="sub">Rule ${t.id} is no longer in the playbook.</div>`).join("") : `<div class="sub">The agent cited no rules for this decision.</div>`}</div>` : ""}</div>`;
}

// ---------- Rollback ----------
function vRollback() {
  const rbs = by("rollback").slice().reverse();
  if (!rbs.length) return `<div class="card"><h2>Rollback</h2><div class="empty">No rollbacks yet. From Blame, copy the command for the edit you want gone; it rebuilds the playbook without that edit, rescores it, and the result appears here.</div></div>`;
  return rbs.map(r => `<div class="card" style="margin-bottom:14px"><h2 style="color:${colorOf(r.lineage)}">${r.lineage} · rolled back ${r.edit_id}</h2>
    <div class="grid g2"><div><div class="sub">with the edit</div><div class="stat">${pct(r.with.test.both_acc)}</div><div class="sub">locked test · val ${pct(r.with.val.both_acc)}</div></div>
    <div><div class="sub">without it</div><div class="stat" style="color:${r.without.test.both_acc >= r.with.test.both_acc ? "var(--good)" : "var(--bad)"}">${pct(r.without.test.both_acc)}</div><div class="sub">locked test · val ${pct(r.without.val.both_acc)}</div></div></div>
    <div class="diff" style="margin-top:10px">${diffHtml(r.with.playbook, r.without.playbook)}</div></div>`).join("");
}

// ---------- Cost ----------
function vCost() {
  const c = by("cost").at(-1); const agr = c?.jury_agreement;
  const tot = c ? c.total : { usd: 0, calls: 0, input_tokens: 0, output_tokens: 0 };
  return `<div class="grid g4" style="margin-bottom:14px"><div class="card"><h2>Total spend</h2><div class="stat">$${tot.usd.toFixed(2)}</div><div class="sub">${tot.calls} calls · ${(tot.input_tokens / 1e6).toFixed(2)}M in / ${(tot.output_tokens / 1e6).toFixed(2)}M out</div></div>
  ${c ? Object.entries(c.by_model).map(([m, v]) => `<div class="card"><h2>${m.split("/").pop()}</h2><div class="stat">$${v.usd.toFixed(2)}</div><div class="sub">${v.calls} calls</div></div>`).join("") : ""}
  ${agr ? `<div class="card"><h2>Juror agreement</h2><div class="stat">${pct(agr.agree / Math.max(agr.agree + agr.split, 1))}</div><div class="sub">${agr.agree} agreed · ${agr.split} split</div></div>` : ""}</div>
  <div class="card"><h2>Spend per lineage: what the gate costs</h2><canvas id="c5" style="max-height:220px"></canvas><div class="sub" style="margin-top:8px">Gated lineages pay for verification on every proposed edit; ungated ones pay only to learn. The locked-test scores show what that buys.</div></div>`;
}
function drawCost() {
  const c = by("cost").at(-1); if (!c) return;
  const names = Object.keys(c.per_lineage);
  new Chart(document.getElementById("c5"), { type: "bar", data: { labels: names, datasets: [{ label: "USD", data: names.map(n => c.per_lineage[n]), backgroundColor: names.map(hex) }] },
    options: { scales: { x: { ticks: { color: "#e6e8ef" }, grid: { display: false } }, y: { ticks: { color: "#8b91a3", callback: v => "$" + v }, grid: { color: "#262a36" } } }, plugins: { legend: { display: false } } } });
}
</script>
